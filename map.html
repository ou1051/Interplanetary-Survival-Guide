<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field Office — Freelance Astronaut</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c1673d'/%3E%3Cpath d='M6 20 Q16 14 26 19' stroke='%235ad1ff' stroke-width='2.5' fill='none'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Apple devices use the system font (SF Pro); Inter is the fallback elsewhere -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://trek.nasa.gov" crossorigin />
    <link rel="preconnect" href="https://astro.arcgis.com" crossorigin />
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      #map { position: fixed; inset: 0; }
      #dev {
        position: fixed; left: 50%; transform: translateX(-50%); top: 60px; z-index: 40;
        display: none; gap: 2px; padding: 4px; border-radius: 999px;
        background: rgba(30,30,32,.8); border: .5px solid rgba(255,255,255,.12); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
        font: 600 11px -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif; color: rgba(235,235,245,.6);
      }
      #dev span { padding: 6px 8px 6px 10px; letter-spacing: .12em; }
      #dev button { border: 0; background: none; color: inherit; font: inherit; padding: 6px 10px; border-radius: 999px; cursor: pointer; }
      #dev button.on { background: #636366; color: #fff; }
      @media (max-width: 900px) { #dev { display: none; } }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="dev" aria-label="Developer fixture switch">
      <span>DEV</span>
      <button data-fixture="normal">Fixture</button>
      <button data-fixture="gap">Data gap</button>
      <button data-reset>Reset</button>
    </div>
    <script type="module" src="./src/map/dev/demo.ts"></script>
  </body>
</html>
