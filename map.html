<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freelance Astronaut — Mission map (dev)</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c1673d'/%3E%3Cpath d='M6 20 Q16 14 26 19' stroke='%235ad1ff' stroke-width='2.5' fill='none'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #0c0e11; }
      #map { position: fixed; inset: 0; }
      #dev {
        position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20;
        display: flex; gap: 2px; padding: 4px; border-radius: 999px;
        background: rgba(12,14,17,.8); border: 1px solid rgba(255,255,255,.08);
        font: 600 11px ui-sans-serif, system-ui, sans-serif; color: rgba(244,239,233,.5);
      }
      #dev span { padding: 6px 8px 6px 10px; letter-spacing: .12em; }
      #dev button { border: 0; background: none; color: inherit; font: inherit; padding: 6px 10px; border-radius: 999px; cursor: pointer; }
      #dev button.on { background: rgba(255,255,255,.1); color: #f4efe9; }
      @media (max-width: 900px) { #dev { display: none; } }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="dev" aria-label="Developer fixture switch">
      <span>DEV</span>
      <button data-fixture="normal">Fixture</button>
      <button data-fixture="gap">Data gap</button>
      <button data-reset>Reset</button>
    </div>
    <script type="module" src="./src/map/dev/demo.ts"></script>
  </body>
</html>
