<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Mars — Mission Operations</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c1673d'/%3E%3Cpath d='M6 20 Q16 14 26 19' stroke='%235ad1ff' stroke-width='2.5' fill='none'/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#071022" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://trek.nasa.gov" crossorigin />
    <link rel="preconnect" href="https://astro.arcgis.com" crossorigin />
    <style>
      html, body { margin: 0; height: 100%; background: #071022; }
      #map { position: fixed; inset: 0; }
      #dev {
        position: fixed; left: 50%; transform: translateX(-50%); top: 60px; z-index: 40;
        display: none; gap: 2px; padding: 4px; border-radius: 3px;
        background: #0c1a33; border: 1px solid #1f3560;
        font: 600 11px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #8fa6cc;
      }
      #dev span { padding: 6px 8px 6px 10px; letter-spacing: .12em; }
      #dev button { border: 0; background: none; color: inherit; font: inherit; padding: 6px 10px; border-radius: 3px; cursor: pointer; }
      #dev button.on { background: #0b3d91; color: #fff; }
      @media (max-width: 900px) { #dev { display: none; } }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="dev" aria-label="Developer fixture switch">
      <span>DEV</span>
      <button data-fixture="normal">Fixture</button>
      <button data-fixture="gap">Data gap</button>
      <button data-reset>Reset</button>
    </div>
    <script type="module" src="./src/map/dev/demo.ts"></script>
  </body>
</html>
